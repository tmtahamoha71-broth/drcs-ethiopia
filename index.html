<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Rights and Community Safety Coalition (DRCS)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            text-align: center;
            padding: 30px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        h1 { color: var(--accent-color); margin-bottom: 10px; }
        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        button:hover { opacity: 0.9; }
        #status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ድመማህ / DRCS / GMDN</h1>
        <p>የዲጂታል መብቶችና የማህበረሰብ ደህንነት ጥረት - የጥሰት ሪፖርት ማቅረቢያ መድረክ</p>
    </header>

    <div class="form-card">
        <h2>የጥሰት ሪፖርት ያስገቡ (Anonymous Violation Report)</h2>
        <form id="reportForm">
            <div class="form-group">
                <label for="violation_type">የጥሰቱ ዓይነት (Violation Type)</label>
                <select id="violation_type" required>
                    <option value="">ምረጥ/ይምረጡ</option>
                    <option value="Hate Speech">የጥላቻ ንግግር (Hate Speech)</option>
                    <option value="Mob Harassment">የቡድን ትንኮሳና ስም ማጥፋት (Mob Harassment)</option>
                    <option value="Incitement">ለግጭት ማነሳሳት (Incitement to Violence)</option>
                    <option value="Fake News">ሃሰተኛ መረጃ/ዲሲንፎርሜሽን (Disinformation)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="platform">ማህበራዊ ሚዲያ (Platform)</label>
                <select id="platform" required>
                    <option value="">ምረጥ/ይምረጡ</option>
                    <option value="Facebook">Facebook</option>
                    <option value="TikTok">TikTok</option>
                    <option value="Telegram">Telegram</option>
                    <option value="X/Twitter">X (Twitter)</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Other">ሌላ (Other)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="target_url">የጥሰቱ ሊንክ (Target Post/Account URL)</label>
                <input type="url" id="target_url" placeholder="https://facebook.com/..." required>
            </div>

            <div class="form-group">
                <label for="description">የጥሰቱ ዝርዝር መግለጫ (Description)</label>
                <textarea id="description" rows="4" placeholder="የደረሰውን ጥሰት ወይም የጥላቻ ንግግሩን ዝርዝር ይፃፉ..." required></textarea>
            </div>

            <div class="form-group">
                <label for="evidence_url">የስክሪንሾት/የማስረጃ ሊንክ (Evidence URL - Optional)</label>
                <input type="url" id="evidence_url" placeholder="https://imgur.com/... ወይም Drive Link">
            </div>

            <div class="form-group">
                <label for="reporter_contact">የስልክ ቁጥር/ኢሜይል (Contact - Optional/ለክትትል ብቻ)</label>
                <input type="text" id="reporter_contact" placeholder="ምስጢራዊነቱ የተጠበቀ ነው">
            </div>

            <button type="submit" id="submitBtn">ሪፖርቱን ላክ (Submit Report)</button>
        </form>
        <div id="status-msg"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://fvgriyjuiczsxrsjelnx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_eexeY_6oyTH4Rx3VQNUv2w_sqEuFZD8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('reportForm');
    const statusMsg = document.getElementById('status-msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerText = 'እየተላከ ነው...';

        const payload = {
            violation_type: document.getElementById('violation_type').value,
            platform: document.getElementById('platform').value,
            target_url: document.getElementById('target_url').value,
            description: document.getElementById('description').value,
            evidence_url: document.getElementById('evidence_url').value || null,
            reporter_contact: document.getElementById('reporter_contact').value || null
        };

        try {
            const { data, error } = await _supabase
                .from('reports')
                .insert([payload]);

            if (error) throw error;

            statusMsg.style.display = 'block';
            statusMsg.style.backgroundColor = 'rgba(34, 197, 94, 0.2)';
            statusMsg.style.color = '#4ade80';
            statusMsg.innerText = 'ሪፖርትዎ በስኬት ደርሶናል! ስለ ትብብርዎ እናመሰግናለን።';
            form.reset();
        } catch (err) {
            console.error(err);
            statusMsg.style.display = 'block';
            statusMsg.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
            statusMsg.style.color = '#f87171';
            statusMsg.innerText = 'ሪፖርቱን መላክ አልተቻለም። እባክዎ ደግመው ይሞክሩ።';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'ሪፖርቱን ላክ (Submit Report)';
        }
    });
</script>

</body>
</html>
